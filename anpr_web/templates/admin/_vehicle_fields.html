{% if errors %}<div class="error" role="alert"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
<form class="panel form-stack" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Plate number<input name="plate_number" maxlength="20" value="{{ values.plate_number }}" required></label>
  <label>Display owner name<input name="display_name" maxlength="80" value="{{ values.display_name }}" required></label>
  <label>Email address (optional)<input name="email" type="email" maxlength="254" value="{{ values.email or '' }}" autocomplete="email"></label>
  <label>Category<select name="category" required>
    <option value="">Choose category</option>
    {% for category in categories %}<option value="{{ category }}" {% if values.category == category %}selected{% endif %}>{{ category|title }}</option>{% endfor %}
  </select></label>
  <label class="checkbox"><input name="is_active" type="checkbox" value="1" {% if values.is_active %}checked{% endif %}> Active</label>
  <label class="checkbox"><input name="email_notifications_enabled" type="checkbox" value="1" {% if values.email_notifications_enabled %}checked{% endif %}> Send visit-summary emails after exit.</label>
  <p class="privacy-note">Enable only with the recipient’s consent. Email is used for visit summaries and is never shown publicly.</p>
  <button type="submit">Save vehicle</button>
</form>
