<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ANPR access-decision portfolio prototype">
  <title>{% block title %}ANPR Prototype{% endblock %}</title>
  <script>
    (() => {
      const saved = localStorage.getItem("anpr-theme");
      const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('web.index') }}">ANPR<span>/lab</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false"
            aria-controls="main-navigation">
      <span class="nav-toggle-icon" aria-hidden="true"></span>
      <span class="sr-only">Open navigation</span>
    </button>
    <nav id="main-navigation" aria-label="Main navigation">
      <a href="{{ url_for('web.index') }}">Demo</a>
      <a href="{{ url_for('web.registered_vehicles') }}">Registered Vehicles</a>
      <a href="{{ url_for('web.access_history') }}">Access History</a>
      <a href="{{ url_for('web.architecture') }}">Architecture</a>
      <a href="{{ url_for('web.privacy') }}">Privacy</a>
      {% if session.admin_authenticated %}
      <a href="{{ url_for('web.admin_dashboard') }}">Admin Dashboard</a>
      <form class="nav-form" action="{{ url_for('web.admin_logout') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Logout</button>
      </form>
      {% else %}
      <a href="{{ url_for('web.admin_login') }}">Admin</a>
      {% endif %}
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme"
              title="Switch to dark theme"><span aria-hidden="true">◐</span></button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (() => {
      const button = document.querySelector(".theme-toggle");
      const navToggle = document.querySelector(".nav-toggle");
      const navigation = document.querySelector("#main-navigation");
      const update = () => {
        const dark = document.documentElement.dataset.theme === "dark";
        button.setAttribute("aria-label", `Switch to ${dark ? "light" : "dark"} theme`);
        button.title = button.getAttribute("aria-label");
      };
      button.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("anpr-theme", next);
        update();
      });
      update();

      const closeNavigation = () => {
        navToggle.setAttribute("aria-expanded", "false");
        navToggle.querySelector(".sr-only").textContent = "Open navigation";
      };
      navToggle.addEventListener("click", () => {
        const open = navToggle.getAttribute("aria-expanded") === "true";
        navToggle.setAttribute("aria-expanded", String(!open));
        navToggle.querySelector(".sr-only").textContent = open ? "Open navigation" : "Close navigation";
      });
      navigation.addEventListener("click", (event) => {
        if (event.target.closest("a")) closeNavigation();
      });
      matchMedia("(min-width: 769px)").addEventListener("change", closeNavigation);
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
