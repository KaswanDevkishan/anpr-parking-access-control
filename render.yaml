services:
  - type: web
    name: anpr-access-decision-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANPR_MATCHING_POLICY
        value: exact
      - key: ANPR_SQLITE_PATH
        value: /tmp/anpr_web.sqlite3
      - key: ANPR_TIMEZONE
        value: Asia/Tokyo
      - key: ANPR_CHECKPOINT_MODE
        value: selectable
      - key: ANPR_SECRET_KEY
        sync: false
      - key: ANPR_ADMIN_USERNAME
        sync: false
      - key: ANPR_ADMIN_PASSWORD_HASH
        sync: false
      - key: ANPR_EMAIL_ENABLED
        value: "true"
      - key: ANPR_EMAIL_BACKEND
        value: smtp
      - key: ANPR_SMTP_HOST
        value: smtp.gmail.com
      - key: ANPR_SMTP_PORT
        value: "587"
      - key: ANPR_SMTP_USERNAME
        sync: false
      - key: ANPR_SMTP_PASSWORD
        sync: false
      - key: ANPR_SMTP_USE_TLS
        value: "true"
      - key: ANPR_EMAIL_FROM
        sync: false
      - key: ANPR_EMAIL_FROM_NAME
        value: Example Campus Parking
      - key: ANPR_APPLICATION_NAME
        value: University Parking Demo
      - key: ANPR_EMAIL_TIMEOUT_SECONDS
        value: "5"
      - key: ANPR_PARKING_CAPACITY
        sync: false
