services:
  - type: web
    name: anpr-access-decision-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: gunicorn --workers 1 --threads 2 --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: ANPR_WEB_OCR_BACKEND
        value: ocr-space
      - key: ANPR_OCR_API_URL
        value: https://api.ocr.space/parse/image
      - key: ANPR_OCR_API_KEY
        sync: false
      - key: ANPR_OCR_TIMEOUT_SECONDS
        value: "15"
      - key: ANPR_MATCHING_POLICY
        value: exact
      - key: ANPR_SQLITE_PATH
        value: /tmp/anpr_web.sqlite3
      - key: ANPR_TIMEZONE
        value: Asia/Tokyo
      - key: ANPR_CHECKPOINT_MODE
        value: selectable
      - key: ANPR_SECRET_KEY
        sync: false
      - key: ANPR_ADMIN_USERNAME
        sync: false
      - key: ANPR_ADMIN_PASSWORD_HASH
        sync: false
      - key: ANPR_EMAIL_ENABLED
        value: "true"
      - key: ANPR_EMAIL_BACKEND
        value: http-api
      - key: ANPR_EMAIL_API_KEY
        sync: false
      - key: ANPR_EMAIL_API_URL
        sync: false
      - key: ANPR_EMAIL_FROM
        sync: false
      - key: ANPR_EMAIL_FROM_NAME
        value: Example Campus Parking
      - key: ANPR_APPLICATION_NAME
        value: University Parking Demo
      - key: ANPR_EMAIL_TIMEOUT_SECONDS
        value: "5"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: ANPR_PARKING_CAPACITY
        sync: false
